aid: light-chaser-animation-studios
name: Light Chaser Animation Studios
description: 'Light Chaser Animation Studios (追光动画) is a Chinese computer-animation film studio founded
  in March 2013 by Gary Wang (王微), founder and former CEO of the video platform Tudou, and headquartered
  in Beijing. The studio produces original CG animated feature films for the Chinese domestic market,
  drawing on Chinese mythology, literature and history. Its released titles include Little Door Gods
  (小门神), Tea Pets (阿唐奇遇), Cats and Peachtopia (猫与桃花源), White Snake (白蛇：缘起), New Gods: Nezha Reborn
  (新神榜：哪吒重生), White Snake 2: Green Snake (白蛇2：青蛇劫起), New Gods: Yang Jian (新神榜：杨戬) and Chang An
  (长安三万里). Light Chaser is a film-production company rather than a technology vendor: its public web
  presence is a bilingual WordPress marketing and recruiting site at zhuiguang.com, and as of this
  enrichment pass it publishes no developer portal, API documentation, SDKs, or machine-readable API
  artifacts of any kind.'
